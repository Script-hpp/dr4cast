[project]
name = "gaia-wobble-bet"
version = "0.1.0"
description = "Pre-registered ML prediction of Gaia DR4 substellar companions from DR3 data"
requires-python = ">=3.11"
dependencies = [
  "astroquery", "astropy", "pyarrow", "duckdb", "polars", "pandas",
  "lightgbm", "scikit-learn", "shap", "matplotlib", "pyyaml",
]

[project.optional-dependencies]
simulation = [
    "astromet>=1.1.9",
    "gaiascanlaw>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia_wobble"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
